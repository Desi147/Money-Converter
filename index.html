<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>快速算錢器</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 480px;
            padding: 32px;
        }

        .title {
            font-size: 1.5rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 24px;
            color: #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: #475569;
        }

        input, select {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid #cbd5e1;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
            background-color: #fff;
        }

        input:focus, select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        button:active {
            transform: scale(0.99);
        }

        .result-box {
            margin-top: 24px;
            padding: 20px;
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            display: none;
            animation: fadeIn 0.25s ease-in-out;
        }

        .result-box.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-item {
            margin-bottom: 12px;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .result-item:last-child {
            margin-bottom: 0;
        }

        .highlight {
            font-weight: 700;
            color: #2563eb;
        }

        .warning {
            color: #dc2626;
            font-weight: 600;
        }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            font-size: 0.75rem;
            font-weight: 600;
            border-radius: 4px;
            background-color: #e0e7ff;
            color: #3730a3;
            margin-left: 6px;
        }
    </style>
</head>
<body>

<div class="card">
    <h1 class="title">💰 快速算錢器</h1>
    
    <div class="form-group">
        <label for="bill">請輸入金額（元）：</label>
        <input type="number" id="bill" placeholder="例如：12345678" min="1">
    </div>

    <div class="form-group">
        <label for="denomination">選擇換鈔 / 硬幣面額：</label>
        <select id="denomination">
            <option value="2000">2000 元面額 (鈔票)</option>
            <option value="1000" selected>1000 元面額 (鈔票)</option>
            <option value="500">500 元面額 (鈔票)</option>
            <option value="200">200 元面額 (鈔票)</option>
            <option value="100">100 元面額 (鈔票)</option>
            <option value="50">50 元面額 (硬幣)</option>
            <option value="10">10 元面額 (硬幣)</option>
        </select>
    </div>

    <button onclick="processExchange()">開始計算</button>

    <div id="result" class="result-box">
        <div class="result-item" id="formattedAmount"></div>
        <hr style="border: 0; border-top: 1px solid #e2e8f0; margin: 12px 0;">
        <div class="result-item" id="exchangeDetail"></div>
    </div>
</div>

<script>
    // 格式化數字轉成中文億/萬/兆單位
    function formatMoney(amount) {
        if (amount === 0) return "0 元";
        
        const units = ["", "萬", "億", "兆"];
        let result = "";
        let unitIdx = 0;
        let temp = amount;

        while (temp > 0 && unitIdx < units.length) {
            let part = temp % 10000;
            if (part > 0) {
                result = part + units[unitIdx] + result;
            }
            temp = Math.floor(temp / 10000);
            unitIdx++;
        }
        return "你輸入了：" + result + " 元";
    }

    // 主計算函式
    function processExchange() {
        const billInput = document.getElementById("bill").value;
        const banknote = parseInt(document.getElementById("denomination").value);
        const resultBox = document.getElementById("result");
        const formattedAmountEl = document.getElementById("formattedAmount");
        const exchangeDetailEl = document.getElementById("exchangeDetail");

        const bill = parseInt(billInput);

        if (isNaN(bill) || bill <= 0) {
            alert("請輸入有效的正整數金額！");
            return;
        }

        // 判斷是鈔票還是硬幣 (100元及以上為鈔票，50與10元為硬幣)
        const isBanknote = banknote >= 100;
        const itemType = isBanknote ? "鈔票" : "硬幣";
        const unitName = isBanknote ? "張" : "個";

        // 1. 顯示大寫中文單位金額
        formattedAmountEl.innerHTML = formatMoney(bill);

        // 2. 計算換算邏輯
        const number = Math.floor(bill / banknote);
        const others = bill % banknote;

        if (number === 0) {
            exchangeDetailEl.innerHTML = `<span class="warning">你是在換屁？（金額小於一個 ${banknote} 元面額）</span>`;
        } else {
            let detailHTML = `你應該要給 <span class="highlight">${banknote}</span> 的${itemType} <span class="highlight">${number}</span> ${unitName}`;

            // 只有鈔票 (>=100) 才計算與顯示匝數
            if (isBanknote) {
                const turn = Math.floor(number / 100);
                const otherofturn = number % 100;

                if (turn !== 0) {
                    detailHTML += `<br>(也就是 <span class="highlight">${turn}</span> 匝的 ${banknote}`;
                    if (otherofturn !== 0) {
                        detailHTML += `，另外還有 <span class="highlight">${otherofturn}</span> 張`;
                    }
                    detailHTML += `)`;
                }
            }

            if (others !== 0) {
                detailHTML += `<br>零頭餘額：<span class="highlight">${others}</span> 元`;
            }

            exchangeDetailEl.innerHTML = detailHTML;
        }

        resultBox.classList.add("active");
    }

    // 支援 Enter 鍵直接計算
    document.getElementById("bill").addEventListener("keypress", function(event) {
        if (event.key === "Enter") {
            processExchange();
        }
    });
</script>

</body>
</html>
